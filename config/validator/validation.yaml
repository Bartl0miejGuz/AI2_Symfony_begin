
App\Entity\Location:
    properties:
        city:
            - NotBlank:
                  groups: [create, edit]
            - Length:
                  min: 2
                  max: 100
                  groups: [create, edit]

        country:
            - NotBlank:
                  groups: [create, edit]

        latitude:
            - Range:
                  min: -90
                  max: 90
                  groups: [create, edit]

        longitude:
            - Range:
                  min: -180
                  max: 180
                  groups: [create, edit]

App\Entity\Measurement:
    properties:
        date:
            - NotNull:
                  groups: [create, edit]

        celsius:
            - NotNull:
                  groups: [create, edit]
            - Range:
                  min: -100
                  max: 60
                  groups: [create, edit]

        location:
            - NotNull:
                  groups: [create, edit]
